import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def launch_site():
    import embed
    platform.document.body.style.background = "#010703"

    platform.window.transfer.hidden = True
    platform.window.pipboy_stage("Preparing application files…")
    platform.window.canvas.style.visibility = "visible"


    bundle = "pipboy-web"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/pipboy-web
    appdir.mkdir()


    # Pygbag defaults to credentials=omit. Our owner-private Site needs its
    # existing same-origin session cookie when downloading the app archive.
    platform.fopen.flags = platform.ffi({"redirect": "follow", "credentials": "same-origin"})
    platform.window.pipboy_stage("Downloading Pi-Boy application…")

    # unpack filesystem from compressed archive into work dir
    import zipfile
    async with platform.fopen("pipboy-web.apk?v=3", "rb") as archive:
        with zipfile.ZipFile(archive) as zip_ref:
            zip_ref.extractall(appdir.as_posix())

    platform.window.pipboy_stage("Preparing graphics and sound…")

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    deadline = asyncio.get_running_loop().time() + 90
    while embed.counter()<0:
        if asyncio.get_running_loop().time() > deadline:
            raise TimeoutError("Graphics preparation timed out. Please retry the beta.")
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Tap the screen to start Pi-Boy"
        platform.window.pipboy_stage(msg)
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.pipboy_stage(f"Installing {pkg}…")

    platform.window.pipboy_stage("Starting Python/Pygame…")
    await shell.source(str(main), callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

async def custom_site():
    try:
        await launch_site()
    except Exception as error:
        import traceback
        traceback.print_exc()
        platform.window.pipboy_fail(f"{type(error).__name__}: {error}")

asyncio.run(custom_site())

<script>
function pipboy_send(state, detail) {
    parent.postMessage(JSON.stringify({type:'pipboy-beta',state,detail}),location.origin);
}
function pipboy_stage(detail) {
    document.getElementById('infobox').textContent = detail;
    pipboy_send('loading', detail);
}
function pipboy_fail(detail) {
    document.getElementById('transfer').hidden = true;
    const info = document.getElementById('infobox');
    info.style.display = 'block';
    info.textContent = 'Unable to start Pi-Boy. See the status beside the screen.';
    pipboy_send('error', detail);
}
window.addEventListener('error', event => pipboy_fail(event.message || 'A runtime file could not load.'));
window.addEventListener('unhandledrejection', event => pipboy_fail(String(event.reason || 'Runtime download failed.')));
// Reports runtime download progress before Python can send its own stages.
window.addEventListener('DOMContentLoaded', () => {
    const status = document.getElementById('status');
    new MutationObserver(() => {
        if (status.textContent.trim()) pipboy_send('loading', status.textContent.trim());
    }).observe(status, {childList:true,subtree:true,characterData:true});
});
</script>
